[project]
name = "a-maze-ing"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mlx",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
]

[tool.uv.sources]
mlx = { path = "mlx-2.4-py3-none-any.whl" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/visualiser"]
